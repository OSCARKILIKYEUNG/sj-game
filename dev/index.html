<html lang="en">
<head>
<meta charset="utf-8">

<style>

    -webkit-touch-callout:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{box-shadow:0 6px 30px rgba(60,50,30,.35);border-radius:4px;background:#f9f6ec;
    touch-action:none;}
  #tiltBtn{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:5.5%;
    z-index:50;background:#e23c3a;color:#fff;border:3px solid #2a2620;border-radius:12px;
    padding:10px 18px;white-space:nowrap;max-width:92vw;
    font:700 15px/1.2 -apple-system,BlinkMacSystemFont,"PingFang TC","PingFang HK",
      "Microsoft JhengHei","Segoe Print","Comic Sans MS",sans-serif;
    box-shadow:0 4px 14px rgba(60,50,30,.4);}
  /* v7 SAVE CODE overlay (A8): DOM textarea + buttons, shown only in the LAB (src/codebox.js) */
  #codeBox{display:none;position:fixed;inset:0;z-index:60;background:rgba(42,38,32,.42);
    align-items:center;justify-content:center;}
  #codeCard{box-sizing:border-box;width:min(420px,90vw);background:#fffdf4;color:#2a2620;
    border:3px solid #2a2620;border-radius:10px;padding:14px 14px 12px;
    box-shadow:0 6px 26px rgba(60,50,30,.45);
    font:700 14px/1.35 "Segoe Print","Comic Sans MS","Chalkboard SE",cursive;}
  #codeCard h2{margin:0 0 6px;font:700 22px/1.1 "Segoe Print","Comic Sans MS","Chalkboard SE",cursive;
    color:#4c7f1f;}
  #codeMsg{min-height:2.7em;color:#6b6556;}
  #codeMsg.ok{color:#4c7f1f;} #codeMsg.err{color:#c9302c;} #codeMsg.warn{color:#a8201f;}
  /* the code must be selectable / pasteable: override the page-wide user-select:none */
  #codeTxt{display:block;box-sizing:border-box;width:100%;height:118px;margin:8px 0 10px;
    resize:none;padding:8px;border:2px solid #2a2620;border-radius:6px;background:#f9f6ec;
    color:#2a2620;font:16px/1.25 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;
    user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;}
  #codeCard .row{display:flex;gap:8px;}
  #codeCard button{flex:1;padding:10px 4px;border:3px solid #2a2620;border-radius:8px;
    background:#fffdf4;color:#2a2620;cursor:pointer;
    font:700 16px/1.1 "Segoe Print","Comic Sans MS","Chalkboard SE",cursive;}
  #codeCopy{color:#3763c9 !important;} #codeImport{color:#c9302c !important;}
  #fatal{display:none;position:fixed;inset:20px;background:#fff3f3;color:#a00;
    font:14px/1.5 monospace;padding:16px;border:3px solid #a00;border-radius:6px;
    white-space:pre-wrap;z-index:99;}

<div id="wrap"><canvas id="game"></canvas></div>
<button id="tiltBtn">ENABLE TILT 開啟重力感應</button>
<div id="codeBox"><div id="codeCard">

  <div id="codeMsg"></div>
  <textarea id="codeTxt" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  <div class="row"><button id="codeCopy" type="button">COPY</button><button id="codeImport" type="button">IMPORT</button><button id="codeClose" type="button">CLOSE</button></div>
</div></div>
<div id="fatal"></div>

// fatal error overlay — registered BEFORE the game bundle so even a
// load-time error (sprite baking etc.) is visible, incl. headless shots

  var d = document.getElementById('fatal');
  d.style.display = 'block';
  d.textContent = 'JS ERROR: ' + e.message + '\n' + (e.filename || '') + ':' + e.lineno;
});
</script>

    SUIT_IDS,
    WEB_IDS,
    CODE,
    openCode,
    closeCode,
    codeCopy,
    codeImport,
    codeIsOpen,
    // ---- v7 stage 3.3 (A5) ----
    powerBtnVisible,
    powerGreyed,
    powerReady,
    powerActive,
    powerFull,
    firePower,
    suitPower,
    legsReach,
    powClimb,

    bossBody,
    killThug,
    koEnemy,
    SUIT_STAT_BASE,
    equippedSuit,
    spideyKey,
    SUIT_PAL,
    SPIDEY_POSES,
    SPIDEY_W,
    SPIDEY_H,
    drawSpidey,
    bakeSpidey,
    // ---- v7 art port (Addendum B) ----
    ensureSuit,
    bakedSuits,
    bakeAllSuits,
    canvasBytes,
    ART_SCALE,
    ZIP_HAND,
    CARRY_HAND,
    gloveAt,
    SUITS,
    spideyHead,
    IRON_FIST,
    ALLY_KEYS,
    RAISED_HAND,
    pickPose,
    HURT_POSE_T,
    POWER_POSE_T,
    PLAYER_DY,
    playerPt,
    drawCity,
    cityStats,
    setCityTimer,
    cityCacheBytes,
    cityCacheKeys,
    cityReset,
    cityCamH,
    visibleBands,
    zoneAt,
    cityWarm,
    cityWarmStats,
    setPow: (v) => {
      G.pow = v;
    },
    get: () => ({
      state: G.state,
      boss: G.boss,
      globs: G.globs,
      platforms: G.platforms,
      player: G.player,
      webAmmo: G.webAmmo,
      glideAmmo: G.glideAmmo,
      zip: G.zip,
      gliding: G.gliding,
      nextBossAt: G.nextBossAt,
      bonus: G.bonus,
      cam: G.cam,
      score: score(),
      mouse: G.mouse,
      lives: G.lives,
      respawnInv: G.respawnInv,
      enemies: G.enemies,
      bullets: G.bullets,
      ironCarry: G.ironCarry,
      paused: G.paused
    }),
    setState: (s) => {
      G.state = s;
    },
    setNextBossAt: (v) => {
      G.nextBossAt = v;
    },
    setBossCount: (v) => {
      G.bossCount = v;
    },
    setAmmo: (w, g) => {
      G.webAmmo = w;
      G.glideAmmo = g;
    },
    setPlayer: (o) => Object.assign(G.player, o),
    setMouse: (o) => Object.assign(G.mouse, o),
    setBossHp: (v) => {
      if (G.boss) G.boss.hp = v;
    },
    setTilt: (v) => {
      G.tilt = v;
      G.tiltActive = true;
    },
    setInv: (v) => {
      G.respawnInv = v;
    },
    setLives: (v) => {
      G.lives = v;
    }
  };

  // src/main.js
  var FREEZE = parseFloat(Q.get("freeze") || "0");
  var last = performance.now();
  function frame(now2) {
    const dt = Math.min(0.033, Math.max(0, (now2 - last) / 1e3));
    last = now2;
    try {
      update(dt);
      render();
    } catch (err) {
      const d = document.getElementById("fatal");
      d.style.display = "block";
      d.textContent = "JS ERROR: " + err.message + "\n" + (err.stack || "");
      return;
    }
    if (FREEZE && G.t >= FREEZE) return;
    requestAnimationFrame(frame);
  }
  resetGame();
  G.state = "TITLE";
  G.run.banked = true;
  var POWERED = Q.get("powered") === "1";
  var debugStart = () => POWERED ? startEndless(true) : startGame();
  if (Q.get("start") || Q.get("boss") || POWERED) debugStart();
  var dh = parseInt(Q.get("h") || "0", 10);
  if (dh > 0) {
    if (G.state === "TITLE") debugStart();
    debugJumpTo(dh);
  }
  if (Q.get("tut") != null) {
    G.state = "TUTOR";
    G.tutTopic = parseInt(Q.get("tut"), 10) || 0;
  }
  var gk = Q.get("gear");
  if (gk === "cap" || gk === "sense" || gk === "hulk" || gk === "hawk") G.stored = gk;
  var ik = Q.get("item");
  if (ik && G.platforms[0]) G.platforms[0].item = { kind: ik, amt: ik === "web" || ik === "wing" ? 5 : 0 };
  if (Q.get("sense")) G.senseT = parseFloat(Q.get("sense")) || 3;
  if (Q.get("cleared") != null) G.storyCleared = parseInt(Q.get("cleared"), 10) || 0;
  if (Q.get("map")) G.state = "MAP";
  if (Q.get("level")) startLevel(parseInt(Q.get("level"), 10) || 1);
  if (Q.get("pow") != null && G.state !== "TITLE") G.pow = Math.max(0, Math.min(100, parseFloat(Q.get("pow")) || 0));
  if (Q.get("lab") === "1" && G.state === "TITLE") openLab();
  requestAnimationFrame(frame);
})();

</script>
